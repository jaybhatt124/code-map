<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODEMAP — Programming Learning Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">CODEMAP</a>
  </nav>
  <main class="container">
    <div class="hero">
      <h1>Programming Learning Platform</h1>
      <p>Choose a subject to start learning with animated visualizations</p>
    </div>
    <div class="subject-grid" id="subjectGrid"></div>
  </main>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"></button>
  <script src="js/theme.js"></script>
  <script src="js/subjects-data.js"></script>
  <script>
    var grid = document.getElementById("subjectGrid");
    SUBJECTS.forEach(function(s) {
      var total = 0;
      s.units.forEach(function(u) { total += u.concepts.length; });
      var card = document.createElement("a");
      card.href = "subject.html?id=" + s.id;
      card.className = "subject-card";
      card.style.borderColor = s.color;
      card.innerHTML =
        '<div class="subject-icon">' + s.icon + '</div>' +
        '<h2>' + s.title + '</h2>' +
        '<p class="subject-subtitle">' + s.subtitle + '</p>' +
        '<p class="subject-desc">' + s.description + '</p>' +
        '<div class="subject-meta">' +
          '<span>' + s.units.length + ' Units</span>' +
          '<span>' + total + ' Concepts</span>' +
        '</div>';
      grid.appendChild(card);
    });
  </script>
</body>
</html>
